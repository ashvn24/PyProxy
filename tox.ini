[tox]
env_list = lint, typecheck, py313
min_version = 4.0

[testenv]
package = editable
deps =
    .[test]
commands =
    pytest {posargs:tests/ --cov=pyproxy --cov-report=term-missing}

[testenv:lint]
skip_install = true
deps =
    ruff>=0.8
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:typecheck]
deps =
    .[dev]
commands =
    mypy src/

[testenv:coverage]
deps =
    .[test]
commands =
    pytest tests/ --cov=pyproxy --cov-report=term-missing --cov-report=html --cov-fail-under=95
