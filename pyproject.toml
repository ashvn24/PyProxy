[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-pyproxy"
version = "0.2.0"
description = "A modern, production-grade reverse proxy built on Python asyncio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ashwin VK" },
]
keywords = [
    "reverse-proxy",
    "proxy",
    "asyncio",
    "load-balancer",
    "http",
    "websocket",
    "gateway",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "PyYAML>=6.0",
    "orjson>=3.9",
    "watchfiles>=1.0",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "tox>=4.0",
    "types-PyYAML>=6.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.3",
    "coverage[toml]>=7.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/ashvn24/PyProxy"
Documentation = "https://github.com/ashvn24/PyProxy/blob/main/README.md"
Repository = "https://github.com/ashvn24/PyProxy"
Issues = "https://github.com/ashvn24/PyProxy/issues"
Changelog = "https://github.com/ashvn24/PyProxy/blob/main/CHANGELOG.md"

[project.scripts]
pyproxy = "pyproxy.cli:cli_entry_point"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/pyproxy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyproxy/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "PTH",  # flake8-use-pathlib
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "ASYNC",# flake8-async
    "LOG",  # flake8-logging
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "S101",    # use of assert (needed in tests)
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert is fine in tests
    "ANN",    # annotations not required in tests
    "D",      # docstrings not required in tests
]

[tool.ruff.lint.isort]
known-first-party = ["pyproxy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = "uvloop.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "watchfiles.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:watchfiles.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["pyproxy"]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
